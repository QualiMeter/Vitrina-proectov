        caseStatus:
          $ref: '#/components/schemas/CaseStatus'
        applicationId:
          $ref: '#/components/schemas/Id'
        teamId:
          $ref: '#/components/schemas/Id'
        format:
          $ref: '#/components/schemas/CaseApplicationFormat'
        role:
          type: string
          enum:
          - SOLO
          - CAPTAIN
          - MEMBER
        applicationStatus:
          $ref: '#/components/schemas/CaseApplicationStatus'
        teamExecutionStatus:
          type: string
          enum:
          - ACTIVE
          - ELIMINATED
          - EXCLUDED
      description: Роль вычисляется сервером на момент запроса; не принимать её из клиентской формы.
    MyCaseParticipationListResponse:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyCaseParticipation'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    DirectoryEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
    ReferenceDataResponse:
      type: object
      additionalProperties: false
      required:
      - directions
      - technologies
      - competencies
      - portfolioCategories
      - institutes
      properties:
        directions:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        competencies:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        portfolioCategories:
          type: array
          description: Список категорий из ТЗ, не задавать названия девяти категорий без утверждённого справочника.
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        institutes:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'

  responses:
    AcceptedWithoutEnumeration:
      description: Запрос принят, информация отправлена при наличии адресата
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - message
            properties:
              message:
                type: string
                example: Если адрес зарегистрирован, письмо будет отправлено.
    BadRequest:
      description: Некорректный JSON, параметры или токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Нет действующей сессии или неверные учётные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Недостаточно прав, заблокированный аккаунт или неверный CSRF
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Сущность отсутствует или скрыта по политике доступа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Конфликт с текущим состоянием, дубликат или использованный токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Предметные ограничения полей и сущностей нарушены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Превышено ограничение частоты вызовов
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
