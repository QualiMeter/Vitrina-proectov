components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-vitrina_session
      description: 'Непрозрачный идентификатор серверной сессии в HttpOnly Secure

        SameSite=Lax Path=/ cookie; без Domain. Сессия истекает через

        12 часов бездействия или не позднее 7 дней после выдачи.

        Настоящий секрет не возвращается в JSON и не хранится в localStorage.

        '
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 'Анти-CSRF request token из GET /api/v1/auth/csrf. Обязателен

        для любого POST/PATCH/PUT/DELETE, даже если метод доступен гостю.

        '
      schema:
        type: string
        minLength: 20
        maxLength: 2048
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CaseIdPath:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TeamIdPath:
      name: teamId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TeamInvitationIdPath:
      name: invitationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TransferIdPath:
      name: transferId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Один ключ на одно намеренное действие. Повтор той же команды с тем же ключом должен вернуть тот
        же итог без второго эффекта; смена тела при том же ключе -> 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[a-zA-Z0-9_-]+$
    StageIdPath:
      name: stageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CheckpointIdPath:
      name: checkpointId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  schemas:
    Id:
      type: string
      format: uuid
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      description: 'Согласованное правило: от 8 до 128 символов, без обязательных классов

        символов. Хешировать на сервере современным password KDF;

        ограничивать число попыток входа и отклонять известные слабые пароли.

        '
    DisplayName:
      type: string
      minLength: 2
      maxLength: 200
    Nickname:
      type: string
      minLength: 2
      maxLength: 32
      description: Обязательный никнейм студента; правила уникальности и допустимых символов согласовать при backend-review.
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
      - csrfToken
      properties:
        csrfToken:
          type: string
          minLength: 20
    RegisterStudentRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - fullName
      - nickname
      - privacyAccepted
      - privacyPolicyVersion
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          $ref: '#/components/schemas/DisplayName'
        nickname:
          $ref: '#/components/schemas/Nickname'
        privacyAccepted:
          type: boolean
          const: true
          description: Факт явного согласия; сервер фиксирует дату и версию политики
        privacyPolicyVersion:
          type: string
          minLength: 1
          maxLength: 40
          description: Идентификатор опубликованной редакции политики; сервер проверяет допустимость
        academic:
          $ref: '#/components/schemas/AcademicProfileInput'
    AcademicProfileInput:
      type: object
      additionalProperties: false
      description: 'Необязательно при регистрации, но проверяется перед подачей заявки

        в кейс, для которого требуются академические ограничения.

        '
      properties:
        instituteId:
          $ref: '#/components/schemas/Id'
        course:
          type: integer
          minimum: 1
          maximum: 6
        studyGroup:
          type: string
          minLength: 1
          maxLength: 64
    PendingVerificationResponse:
      type: object
      additionalProperties: false
      required:
      - nextAction
      - message
      properties:
        nextAction:
          type: string
          const: VERIFY_EMAIL
        message:
          type: string
          example: Проверьте почту для подтверждения регистрации.
    EmailRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          $ref: '#/components/schemas/Email'
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 2048
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 2048
        newPassword:
          $ref: '#/components/schemas/Password'
    GlobalRole:
      type: string
      enum:
      - STUDENT
      - UNIVERSITY_STAFF
      - PLATFORM_ADMIN
      description: 'Куратор и капитан не являются глобальными ролями. Компания

        получает доступ через CompanyMembership. Разрешено несколько ролей.

        '
    AvailableArea:
      type: string
      enum:
      - student
      - company
      - university
      - mentor
      - admin
    CompanyMembershipRole:
      type: string
      enum:
