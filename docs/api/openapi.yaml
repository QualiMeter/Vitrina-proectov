      type: object
      additionalProperties: false
      required:
      - purpose
      - caseId
      - file
      properties:
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        caseId:
          $ref: '#/components/schemas/Id'
        stageId:
          $ref: '#/components/schemas/Id'
        checkpointId:
          $ref: '#/components/schemas/Id'
        applicationId:
          $ref: '#/components/schemas/Id'
        file:
          type: string
          contentMediaType: application/octet-stream
      description: STAGE_MATERIAL требует stageId, SUBMISSION_ATTACHMENT требует checkpointId и applicationId. Сверять
        контекст с фактической БД.
      allOf:
      - if:
          properties:
            purpose:
              const: STAGE_MATERIAL
          required:
          - purpose
        then:
          required:
          - stageId
          not:
            anyOf:
            - required:
              - checkpointId
            - required:
              - applicationId
      - if:
          properties:
            purpose:
              const: SUBMISSION_ATTACHMENT
          required:
          - purpose
        then:
          required:
          - checkpointId
          - applicationId
          not:
            required:
            - stageId
