openapi: 3.1.0
info:
  title: 'Витрина ИТ-проектов УУНиТ — P0: авторизация, студенты, кейсы, выполнение и итоги'
  version: 0.1.5-draft
  description: Единый проектный контракт, не реализованный backend. Auth/Companies (0.1), Teams/Applications (0.1.1),
    Execution/Files (0.1.2), Evaluations/Results (0.1.3), StudentProfiles/ReferenceData (0.1.4), TL decisions (0.1.5). Утверждённые правила и предложения разделяются в docs/decisions/001-auth-and-permissions.md
    и docs/architecture/case-evaluation-results.md. Результаты и отзывы не публикуются до ручного подтверждения
    компанией. Без автоматического ранжирования по баллам; совместные места — только если разрешены опубликованными
    условиями. Для SOLO действует ручной отбор, NDA подтверждает капитан (или solo) при подаче заявки.
    Смена капитана — по подтверждению, состав команды фиксируется при submit, повторное участие после WITHDRAWN/REJECTED запрещено.
servers:
- url: /
  description: Тот же origin, что и frontend; /api/* проксируется backend
tags:
- name: StudentProfiles
  description: Личный профиль, публичная карточка и участия студента (P0 плана v2.1)
- name: ReferenceData
  description: Опубликованные read-only справочники для P0 форм и фильтров
- name: Auth
  description: Сессии, регистрация, подтверждение email, восстановление
- name: Companies
  description: Публичные сведения и администрирование компаний
- name: Invitations
  description: Создание и принятие приглашений компаний
- name: Cases
  description: Корпоративные кейсы и модерация
- name: Teams
  description: Команды конкретного кейса и приглашения
- name: Applications
  description: Черновики заявок, допуск и отзыв
- name: Stages
  description: Конфигурация этапов кейса до публикации
- name: Checkpoints
  description: Контрольные точки, ручное закрытие и ручной отбор
- name: Execution
  description: Рабочее пространство и ручной старт
- name: Submissions
  description: История неизменяемых версий сдач
- name: Files
  description: Загрузка, метаданные и авторизованная выдача файлов
- name: NDA
  description: Ознакомление с NDA и индивидуальное подтверждение
- name: Evaluation
  description: Приватная проверка сдач, текстовые отзывы и необязательные оценки
- name: Results
  description: Ручные призовые места, номинации и подтверждённые результаты конкурса
paths:
  /api/v1/auth/csrf:
    get:
      tags:
      - Auth
      operationId: authGetCsrf
      summary: Получить CSRF-токен (в том числе до входа)
      description: 'Создаёт/обновляет необходимые antiforgery-cookie и возвращает request

        token для заголовка X-CSRF-Token. Ответ нельзя кешировать.

        После изменения аутентификации клиент повторно запрашивает токен.

        '
      security: []
      responses:
        '200':
          description: Токен для изменяющих запросов
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      operationId: authRegisterStudent
      summary: Самостоятельная регистрация студента
      description: 'Публичная регистрация только студента. Университетские сотрудники

        и администраторы не могут назначить себе роль через этот метод.

        Учётная запись требует подтверждения email;

        затем отдельный endpoint активирует аккаунт и создаёт сессию.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '202':
          description: Регистрация принята, инструкция отправлена на email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingVerificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/email-verification/confirm:
    post:
      tags:
      - Auth
      operationId: authConfirmEmail
      summary: Подтвердить email самостоятельно зарегистрированного студента
      description: 'Одноразовый токен из письма. В случае успеха создаёт cookie-сессию.

        Ссылки с токеном должны иметь Referrer-Policy: no-referrer;

        frontend отправляет токен серверу в JSON, не в URL API.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Email подтверждён, пользователь вошёл
          headers:
            Set-Cookie:
              description: Secure; HttpOnly; SameSite=Lax; Path=/ cookie-сессия
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/email-verification/resend:
    post:
      tags:
      - Auth
      operationId: authResendEmailConfirmation
      summary: Повторно отправить письмо подтверждения
      description: Ответ одинаковый для существующего и несуществующего адреса.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedWithoutEnumeration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      operationId: authLogin
      summary: Войти по email и паролю
      description: 'В случае успеха сервер создаёт новую сессию, обновляет session cookie,

        очищает временную анонимную сессию. Ошибки неверного пароля не должны

        позволять определить, зарегистрирован ли email.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сессия создана
          headers:
            Set-Cookie:
              description: 'Cookie __Host-vitrina_session: HttpOnly; Secure; SameSite=Lax; Path=/'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      operationId: authLogout
      summary: Отозвать текущую сессию и удалить cookie
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Сессия отозвана
          headers:
            Set-Cookie:
              description: Cookie удаляется через Max-Age=0
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      operationId: authGetMe
      summary: Текущий аккаунт и доступные кабинеты
      description: 'Глобальные роли, членства и список разрешённых кабинетов.

        Проверку разрешений над конкретным проектом этот ответ НЕ заменяет.

        '
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password/forgot:
    post:
      tags:
      - Auth
      operationId: authForgotPassword
      summary: Запросить сброс пароля
      description: 'Всегда одинаковый ответ, независимо от существования email.

        Токен одноразовый, действует 30 минут с момента выдачи,

        хранится в базе только в виде хеша.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/AcceptedWithoutEnumeration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/password/reset:
    post:
      tags:
      - Auth
      operationId: authResetPassword
      summary: Установить новый пароль по одноразовому токену
      description: 'После успеха отозвать все активные сессии пользователя.

        Новый вход нужен отдельно. Токен передаётся только в JSON-теле.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Пароль сменён
          прежние сессии отозваны: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/public/companies/{companyId}:
    get:
      tags:
      - Companies
      operationId: companiesGetPublic
      summary: Публичная карточка компании без закрытых данных
      security: []
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Публичная карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPublic'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies:
    get:
      tags:
      - Companies
      operationId: companiesListPrivate
      summary: Реестр компаний (сотрудник университета)
      description: Требуется право companies.listAll; не возвращать внутренние заметки.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 150
      responses:
        '200':
          description: Постраничный список компаний
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Companies
      operationId: companiesCreate
      summary: Создать компанию (только уполномоченный сотрудник УУНиТ)
      description: Требуется permission companies.create. Публичный саморегистрационный endpoint компаний отсутствует.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Компания создана
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/companies/6fca3ea2-92f5-46ae-94c8-3d2af7a62ccf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPrivate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/companies/{companyId}:
    get:
      tags:
      - Companies
      operationId: companiesGetPrivate
      summary: Карточка компании для сотрудника УУНиТ или члена компании
      description: Требуется companies.readPrivate в контексте компании.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Карточка с внутренними сведениями
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPrivate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/invitations:
    get:
      tags:
      - Invitations
      operationId: invitationsList
      summary: Список приглашений представителей компании
      description: Требуется companies.invite в контексте компании или право УУНиТ.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Список без секретных токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Invitations
      operationId: invitationsCreate
      summary: Отправить приглашение представителю компании
      description: 'Требуется companies.invite. Сервер формирует криптографически случайный

        одноразовый токен сроком на 7 дней и посылает по email;

        сам токен не возвращает.

        '
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Приглашение создано (без токена)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/company-invitations/preview:
    post:
      tags:
      - Invitations
      operationId: invitationsPreview
      summary: Посмотреть организацию и роль до принятия приглашения
      description: 'Токен передаётся в JSON, не в URL запроса; ответ без внутренних данных.

        Не меняет состояние приглашения.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Краткая информация по действительному приглашению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/company-invitations/accept:
    post:
      tags:
      - Invitations
      operationId: invitationsAccept
      summary: Принять приглашение в компанию существующим или новым аккаунтом
      description: 'Режим existing: текущая действительная cookie-сессия обязательна,

        email текущего пользователя должен совпадать с адресом приглашения.

        Режим new: пользователь ещё не вошёл, создаётся новый аккаунт,

        подтверждение владения адресом даёт письмо-приглашение.

        Только после успешной проверки токена, email и прав атомарно создаётся

        членство. Токен одноразовый. Если создаётся аккаунт, выдаётся сессия.

        Приглашение НЕ добавляет произвольных глобальных ролей.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Принято существующим аккаунтом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '201':
          description: Создан новый аккаунт и принято приглашение
          headers:
            Set-Cookie:
              description: Новая защищённая cookie-сессия
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/public/cases:
    get:
      tags:
      - Cases
      operationId: casesListPublic
      summary: Каталог опубликованных кейсов
      description: Только разрешённые к публикации кейсы. Сервер выполняет поиск, фильтрацию, сортировку и пагинацию;
        не выдаёт черновики, закрытые материалы и заявки.
      security: []
      parameters:
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 150
      - name: directionId
        in: query
        schema:
          type: string
      - name: technologyId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CaseStatus'
      - name: participationFormat
        in: query
        schema:
          type: string
      - name: admissionMode
        in: query
        schema:
          type: string
      - name: minCourse
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePublicListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/public/cases/{caseId}:
    get:
      tags:
      - Cases
      operationId: casesGetPublic
      summary: Публичная карточка кейса
      security: []
      parameters:
      - $ref: '#/components/parameters/CaseIdPath'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePublicDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/companies/{companyId}/cases:
    get:
      tags:
      - Cases
      operationId: casesListCompany
      summary: Кейсы компании для уполномоченного представителя
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CompanyIdPath'
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/PageSizeQuery'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePrivateListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Cases
      operationId: casesCreateDraft
      summary: Создать черновик кейса
