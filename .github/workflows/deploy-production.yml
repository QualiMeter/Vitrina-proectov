name: Deploy Vitrina to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrina-production-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vitrina.slnx

      - name: Build
        run: dotnet build Vitrina.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Vitrina.slnx --configuration Release

      - name: Publish API
        run: dotnet publish backend/Vitrina.Api/Vitrina.Api.csproj --configuration Release --no-restore --output "${RUNNER_TEMP}/backend-publish"

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ${{ runner.temp }}/backend-publish/
          if-no-files-found: error
          retention-days: 2

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check generated student types
        run: |
          python3 -m venv "$RUNNER_TEMP/student-codegen"
          "$RUNNER_TEMP/student-codegen/bin/pip" install -r ../scripts/requirements-codegen.txt
          "$RUNNER_TEMP/student-codegen/bin/python" ../scripts/generate_student_types.py --check

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: release/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release/frontend/dist

      - name: Prepare release archive
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$RELEASE_SHA" > release/release.sha
          tar -czf "${RUNNER_TEMP}/vitrina-release.tar.gz" -C release backend frontend release.sha

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          scp -P "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${RUNNER_TEMP}/vitrina-release.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/tmp/vitrina-deploy/release.tar.gz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/vitrina-deploy"
