name: OpenAPI Contract Validation

on:
  pull_request:
    paths:
      - "docs/api/openapi.yaml"
      - "scripts/validate_openapi.py"
      - ".github/workflows/openapi-contract.yml"
  push:
    branches: [main]
    paths:
      - "docs/api/openapi.yaml"
      - "scripts/validate_openapi.py"
      - ".github/workflows/openapi-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi-contract:
    name: openapi-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: |
          python -m pip install "PyYAML==6.0.3" "openapi-spec-validator==0.9.0"
      - name: Validate YAML and OpenAPI 3.1 contract
        run: python scripts/validate_openapi.py
